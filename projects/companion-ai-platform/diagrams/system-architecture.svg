<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
<title id="title">Companion AI Voice Agent Architecture</title><desc id="desc">Top-down view of clients, realtime transport, agent runtime and AI services</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><linearGradient id="accent"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#2563eb"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity=".13"/></filter><marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker><style>.title{font:700 31px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.sub{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.eyebrow{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#7c3aed;letter-spacing:2px}.layer{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#7c3aed;letter-spacing:1.5px}.layerDesc{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}.lane{fill:#fff;stroke:#e2e8f0;stroke-width:1.5}.node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;filter:url(#shadow)}.nodeNo{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#7c3aed}.nodeText{font:600 16px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a;text-anchor:middle}.arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#head)}.note{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}</style></defs>
<rect width="1200" height="980" fill="url(#bg)"/><rect x="65" y="60" width="9" height="90" rx="4" fill="url(#accent)"/>
<text x="95" y="83" class="eyebrow">ENGINEERING CASE STUDY</text><text x="95" y="125" class="title">Companion AI Voice Agent</text><text x="95" y="157" class="sub">Top-down architecture · realtime conversation and care boundary</text>
<g><rect x="65" y="185" width="1070" height="105" rx="18" class="lane"/><text x="90" y="213" class="layer">01 · CLIENT LAYER</text><text x="90" y="235" class="layerDesc">Conversation entry points</text><rect x="390" y="242" width="420" height="42" rx="12" class="node"/><text x="600" y="269" class="nodeText">Resident / Family UI</text></g>
<path d="M600 290 V315" class="arrow"/>
<g><rect x="65" y="320" width="1070" height="105" rx="18" class="lane"/><text x="90" y="348" class="layer">02 · EDGE AND REALTIME LAYER</text><text x="90" y="370" class="layerDesc">Connection and session transport</text><rect x="220" y="377" width="310" height="42" rx="12" class="node"/><text x="375" y="404" class="nodeText">LIFF / Web Apps</text><rect x="670" y="377" width="310" height="42" rx="12" class="node"/><text x="825" y="404" class="nodeText">Fastify Gateway → WebSocket</text><path d="M530 398 H670" class="arrow"/></g>
<path d="M825 425 V450 H600" class="arrow"/>
<g><rect x="65" y="455" width="1070" height="105" rx="18" class="lane"/><text x="90" y="483" class="layer">03 · APPLICATION LAYER</text><text x="90" y="505" class="layerDesc">Conversation orchestration and access rules</text><rect x="390" y="512" width="420" height="42" rx="12" class="node"/><text x="600" y="539" class="nodeText">Agent Runtime · Memory · Access Control</text></g>
<path d="M600 560 V585" class="arrow"/>
<g><rect x="65" y="590" width="1070" height="150" rx="18" class="lane"/><text x="90" y="618" class="layer">04 · AI SERVICES AND DATA LAYER</text><text x="90" y="640" class="layerDesc">External providers, search and persistence</text><rect x="110" y="662" width="300" height="48" rx="12" class="node"/><text x="260" y="691" class="nodeText">STT / LLM / TTS</text><rect x="450" y="662" width="300" height="48" rx="12" class="node"/><text x="600" y="691" class="nodeText">External Search Adapter</text><rect x="790" y="662" width="300" height="48" rx="12" class="node"/><text x="940" y="691" class="nodeText">PostgreSQL / Redis</text><path d="M600 585 V640 H260 V662" class="arrow"/><path d="M600 640 V662" class="arrow"/><path d="M600 640 H940 V662" class="arrow"/></g>
<line x1="65" y1="820" x2="1135" y2="820" stroke="#cbd5e1"/><text x="65" y="860" class="note">Care and family roles are generalized</text><text x="65" y="895" class="note">Public-safe conceptual diagram · production hosts, credentials and personal data omitted</text><text x="65" y="930" class="note">Arrows show the primary request and response path from top to bottom</text></svg>
