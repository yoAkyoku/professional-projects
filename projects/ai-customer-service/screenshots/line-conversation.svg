<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">AI Customer Service / LINE</title><desc id="desc">Tenant-aware conversation and escalation</desc>
<defs><linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#db2777"/><stop offset="1" stop-color="#0f172a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".12"/></filter><style>
body{font-family:Inter,Segoe UI,Arial,sans-serif}.title{font:700 24px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.sub{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}.menu{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}.menuActive{font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#db2777}.card{fill:#fff;stroke:#e2e8f0;filter:url(#shadow)}.label{font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}.value{font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.table{fill:#fff;stroke:#e2e8f0;filter:url(#shadow)}.head{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}.row{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#334155}.pillLight{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.pillDark{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.foot{font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}</style></defs>
<rect width="1200" height="700" fill="#f8fafc"/><rect width="1200" height="72" fill="url(#top)"/><text x="38" y="44" style="font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#fff">PROFESSIONAL DEMO</text><text x="930" y="43" style="font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#dbeafe">SANITIZED UI</text>
<rect x="0" y="72" width="260" height="628" fill="#fff"/><text x="40" y="120" style="font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a">AI Customer Service</text><text x="48" y="176" class="menuActive">Conversations</text><text x="48" y="218" class="menu">Knowledge Base</text><text x="48" y="260" class="menu">Agent</text><text x="48" y="302" class="menu">Escalations</text><text x="48" y="344" class="menu">Settings</text>
<text x="330" y="112" class="title">AI Customer Service / LINE</text><text x="330" y="137" class="sub">Tenant-aware conversation and escalation</text><g><rect x="330" y="168" width="165" height="85" rx="12" class="card"/><text x="348" y="198" class="label">Conversation</text><text x="348" y="230" class="value">Active</text></g><g><rect x="520" y="168" width="165" height="85" rx="12" class="card"/><text x="538" y="198" class="label">Tenant</text><text x="538" y="230" class="value">Example Tenant</text></g><g><rect x="710" y="168" width="165" height="85" rx="12" class="card"/><text x="728" y="198" class="label">Knowledge</text><text x="728" y="230" class="value">Available</text></g><g><rect x="900" y="168" width="165" height="85" rx="12" class="card"/><text x="918" y="198" class="label">Handoff</text><text x="918" y="230" class="value">Ready</text></g>
<rect x="330" y="290" width="795" height="290" rx="14" class="table"/><text x="350" y="322" class="head">Message</text><text x="655" y="322" class="head">Route</text><text x="960" y="322" class="head">State</text><g><line x1="330" y1="355" x2="1125" y2="355" stroke="#e2e8f0"/><text x="350" y="342" class="row">Customer question</text><text x="655" y="342" class="row">RAG</text><rect x="960" y="325" width="125" height="28" rx="14" fill="#db2777"/><text x="980" y="344" class="pillLight">Answered</text></g><g><line x1="330" y1="409" x2="1125" y2="409" stroke="#e2e8f0"/><text x="350" y="396" class="row">Unsupported request</text><text x="655" y="396" class="row">Human</text><rect x="960" y="379" width="125" height="28" rx="14" fill="#e2e8f0"/><text x="980" y="398" class="pillDark">Escalated</text></g><g><line x1="330" y1="463" x2="1125" y2="463" stroke="#e2e8f0"/><text x="350" y="450" class="row">Provider response</text><text x="655" y="450" class="row">LINE</text><rect x="960" y="433" width="125" height="28" rx="14" fill="#db2777"/><text x="980" y="452" class="pillLight">Delivered</text></g>
<text x="330" y="635" class="foot">Recreated demo UI · sample data only · no production customer information</text>
