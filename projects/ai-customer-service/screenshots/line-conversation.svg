<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Recreated LINE AI customer service demo</title><desc id="desc">A sanitized portfolio mockup showing a LINE conversation beside an agent trace with retrieval and escalation details.</desc>
<defs><linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#be185d"/><stop offset="1" stop-color="#4c1d95"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".12"/></filter><style>
.t{font:700 24px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.s{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}.h{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#64748b;letter-spacing:1px}.chat{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#334155}.trace{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#1e293b}.small{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}.pill{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.key{font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#be185d}
</style></defs>
<rect width="1200" height="760" fill="#f8fafc"/><rect width="1200" height="76" fill="url(#top)"/><text x="36" y="47" style="font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#fff">AI CUSTOMER SERVICE</text><text x="1040" y="45" style="font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#fce7f3">RECREATED DEMO</text>
<text x="46" y="125" class="t">LINE Conversation</text><text x="46" y="151" class="s">User message and grounded response</text><text x="650" y="125" class="t">Agent Trace</text><text x="650" y="151" class="s">Tenant-aware routing and retrieval evidence</text>
<rect x="36" y="180" width="550" height="500" rx="18" fill="#fff" filter="url(#shadow)"/><rect x="62" y="206" width="498" height="52" rx="12" fill="#fce7f3"/><circle cx="92" cy="232" r="15" fill="#be185d"/><text x="122" y="238" class="chat">Example LINE User</text><text x="62" y="305" class="small">10:32</text><rect x="126" y="278" width="390" height="70" rx="16" fill="#f1f5f9"/><text x="150" y="309" class="chat">請問停車場在哪裡？</text><text x="150" y="333" class="small">User question</text><text x="62" y="397" class="small">10:32 · AI</text><rect x="62" y="370" width="454" height="112" rx="16" fill="#fdf2f8" stroke="#f9a8d4"/><text x="86" y="406" class="chat">停車場位於入口旁，請依現場指示前往。</text><text x="86" y="435" class="small">Grounded response · source linked</text><rect x="62" y="526" width="454" height="74" rx="12" fill="#fff7ed"/><text x="86" y="557" class="key">Need human support?</text><text x="86" y="581" class="small">Unsupported questions can be escalated to staff.</text><text x="62" y="640" class="small">Sample conversation · no customer identity or real property data</text>
<rect x="620" y="180" width="544" height="500" rx="18" fill="#fff" filter="url(#shadow)"/><rect x="650" y="206" width="484" height="58" rx="12" fill="#f8fafc"/><text x="676" y="231" class="small">Tenant</text><text x="750" y="231" class="trace">Example Tenant</text><text x="676" y="252" class="small">Conversation</text><text x="750" y="252" class="trace">session-demo-01</text>
<text x="650" y="310" class="h">ROUTING TRACE</text><line x1="650" y1="328" x2="1134" y2="328" stroke="#e2e8f0"/>
<text x="676" y="365" class="small">Intent</text><text x="870" y="365" class="trace">general information</text><rect x="1002" y="343" width="100" height="28" rx="14" fill="#be185d"/><text x="1025" y="362" class="pill">RAG</text>
<text x="676" y="417" class="small">Retrieved sources</text><text x="870" y="417" class="trace">parking-faq · site-guide</text>
<text x="676" y="469" class="small">Retrieval</text><text x="870" y="469" class="trace">vector + lexical</text>
<text x="676" y="521" class="small">Answer state</text><rect x="870" y="499" width="130" height="28" rx="14" fill="#16a34a"/><text x="894" y="518" class="pill">GROUNDED</text>
<line x1="650" y1="552" x2="1134" y2="552" stroke="#e2e8f0"/><text x="676" y="592" class="small">Fallback</text><text x="870" y="592" class="trace">Human escalation available</text><text x="650" y="640" class="small">Trace is a portfolio reconstruction of the agent decision boundary</text>
</svg>
