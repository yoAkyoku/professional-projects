<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
<title id="title">Travel Operations and Dispatch Architecture</title><desc id="desc">Top-down view of clients, application API, dispatch domain, data and operations integrations</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient><linearGradient id="accent"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#2563eb"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity=".13"/></filter><marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker><style>.title{font:700 31px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.sub{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.eyebrow{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#0f766e;letter-spacing:2px}.layer{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#0f766e;letter-spacing:1.5px}.layerDesc{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}.lane{fill:#fff;stroke:#e2e8f0;stroke-width:1.5}.node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;filter:url(#shadow)}.nodeText{font:600 16px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a;text-anchor:middle}.arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#head)}.note{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}</style></defs>
<rect width="1200" height="980" fill="url(#bg)"/><rect x="65" y="60" width="9" height="90" rx="4" fill="url(#accent)"/>
<text x="95" y="83" class="eyebrow">ENGINEERING CASE STUDY</text><text x="95" y="125" class="title">Travel Operations and Dispatch</text><text x="95" y="157" class="sub">Top-down architecture · customer, staff and driver collaboration</text>
<g><rect x="65" y="185" width="1070" height="115" rx="18" class="lane"/><text x="90" y="213" class="layer">01 · CLIENT LAYER</text><text x="90" y="235" class="layerDesc">Three clients use the same operational API</text><rect x="85" y="250" width="300" height="42" rx="12" class="node"/><text x="235" y="277" class="nodeText">Operations Console / Next.js</text><rect x="450" y="250" width="300" height="42" rx="12" class="node"/><text x="600" y="277" class="nodeText">Driver App / Expo</text><rect x="815" y="250" width="300" height="42" rx="12" class="node"/><text x="965" y="277" class="nodeText">Customer App / Expo</text></g>
<path d="M235 300 V325 H600" class="arrow"/><path d="M600 300 V325" class="arrow"/><path d="M965 300 V325 H600" class="arrow"/>
<g><rect x="65" y="330" width="1070" height="105" rx="18" class="lane"/><text x="90" y="358" class="layer">02 · APPLICATION LAYER</text><text x="90" y="380" class="layerDesc">API boundary and role-aware access</text><rect x="170" y="387" width="300" height="42" rx="12" class="node"/><text x="320" y="414" class="nodeText">Application API</text><rect x="730" y="387" width="300" height="42" rx="12" class="node"/><text x="880" y="414" class="nodeText">Auth / Role Scope</text><path d="M470 408 H730" class="arrow"/></g>
<path d="M880 435 V460 H600" class="arrow"/>
<g><rect x="65" y="465" width="1070" height="105" rx="18" class="lane"/><text x="90" y="493" class="layer">03 · DOMAIN LAYER</text><text x="90" y="515" class="layerDesc">Order state, dispatch assignment and trip execution</text><rect x="390" y="522" width="420" height="42" rx="12" class="node"/><text x="600" y="549" class="nodeText">Order / Dispatch Domain</text></g>
<path d="M600 570 V595" class="arrow"/>
<g><rect x="65" y="600" width="1070" height="150" rx="18" class="lane"/><text x="90" y="628" class="layer">04 · DATA AND INTEGRATION LAYER</text><text x="90" y="650" class="layerDesc">Persistence and trip operations services</text><rect x="100" y="672" width="300" height="48" rx="12" class="node"/><text x="250" y="701" class="nodeText">Prisma / PostgreSQL</text><rect x="450" y="672" width="300" height="48" rx="12" class="node"/><text x="600" y="701" class="nodeText">Maps / GPS</text><rect x="800" y="672" width="300" height="48" rx="12" class="node"/><text x="950" y="701" class="nodeText">SMS / Push / Slack</text><path d="M600 595 V650 H250 V672" class="arrow"/><path d="M600 650 V672" class="arrow"/><path d="M600 650 H950 V672" class="arrow"/></g>
<path d="M600 750 V775" class="arrow"/>
<g><rect x="65" y="780" width="1070" height="100" rx="18" class="lane"/><text x="90" y="808" class="layer">05 · AI ASSISTANCE</text><text x="90" y="830" class="layerDesc">Drafting, dispatch suggestions, exception classification and risk prompts</text><rect x="390" y="837" width="420" height="32" rx="10" class="node"/><text x="600" y="859" class="nodeText">AI Assistance</text></g>
<line x1="65" y1="910" x2="1135" y2="910" stroke="#cbd5e1"/><text x="65" y="940" class="note">Web, native and provider boundaries are generalized</text><text x="65" y="965" class="note">Public-safe conceptual diagram · production hosts, credentials and customer data omitted</text></svg>
