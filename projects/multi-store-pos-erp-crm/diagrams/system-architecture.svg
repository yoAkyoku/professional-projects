<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
  <title id="title">Multi-store POS / ERP / CRM Architecture</title>
  <desc id="desc">Top-down view of users, application, domain modules, integration reliability and CRM boundaries</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/></filter>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <style>
      .title{font:700 31px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .eyebrow{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#2563eb;letter-spacing:2px}
      .layer{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#2563eb;letter-spacing:1.5px}
      .layerDesc{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}
      .lane{fill:#fff;stroke:#e2e8f0;stroke-width:1.5}
      .node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;filter:url(#shadow)}
      .nodeText{font:600 16px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a;text-anchor:middle}
      .arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrowHead)}
      .note{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}
      .tag{fill:url(#accent)}
    </style>
  </defs>
  <rect width="1200" height="1020" fill="url(#bg)"/>
  <rect x="65" y="60" width="9" height="90" rx="4" class="tag"/>
  <text x="95" y="83" class="eyebrow">ENGINEERING CASE STUDY</text>
  <text x="95" y="125" class="title">Multi-store POS / ERP / CRM Architecture</text>
  <text x="95" y="157" class="subtitle">Top-down architecture · selected commercial features</text>
  <g><rect x="65" y="185" width="1070" height="100" rx="18" class="lane"/><text x="90" y="213" class="layer">01 · CLIENT LAYER</text><text x="90" y="235" class="layerDesc">Store and administration entry point</text><rect x="390" y="237" width="420" height="42" rx="12" class="node"/><text x="600" y="264" class="nodeText">Store and admin users</text></g>
  <path d="M600 285 V310" class="arrow"/>
  <g><rect x="65" y="315" width="1070" height="105" rx="18" class="lane"/><text x="90" y="343" class="layer">02 · PRESENTATION AND APPLICATION LAYER</text><text x="90" y="365" class="layerDesc">POS interface and Laravel request boundary</text><rect x="170" y="372" width="300" height="42" rx="12" class="node"/><text x="320" y="399" class="nodeText">POS Web UI</text><rect x="730" y="372" width="300" height="42" rx="12" class="node"/><text x="880" y="399" class="nodeText">Laravel Application</text><path d="M470 393 H730" class="arrow"/></g>
  <path d="M880 420 V445 H600" class="arrow"/>
  <g><rect x="65" y="450" width="1070" height="115" rx="18" class="lane"/><text x="90" y="478" class="layer">03 · DOMAIN LAYER</text><text x="90" y="500" class="layerDesc">Catalog, transaction, inventory and manufacturing rules</text><rect x="90" y="520" width="300" height="32" rx="10" class="node"/><text x="240" y="542" class="nodeText">Catalog / Item / Variant</text><rect x="450" y="520" width="300" height="32" rx="10" class="node"/><text x="600" y="542" class="nodeText">Sales / Inventory / Purchasing</text><rect x="810" y="520" width="300" height="32" rx="10" class="node"/><text x="960" y="542" class="nodeText">Manufacturing / BOM</text><path d="M600 445 V500 H240 V520" class="arrow"/><path d="M600 500 V520" class="arrow"/><path d="M600 500 H960 V520" class="arrow"/></g>
  <path d="M240 565 V590 H250 V615" class="arrow"/><path d="M600 565 V615" class="arrow"/><path d="M960 565 V590 H600 V615" class="arrow"/>
  <g><rect x="65" y="600" width="1070" height="150" rx="18" class="lane"/><text x="90" y="628" class="layer">04 · DATA AND RELIABILITY LAYER</text><text x="90" y="650" class="layerDesc">POS state, durable sync events and retry handling</text><rect x="100" y="672" width="300" height="48" rx="12" class="node"/><text x="250" y="701" class="nodeText">POS MySQL</text><rect x="450" y="672" width="300" height="48" rx="12" class="node"/><text x="600" y="701" class="nodeText">Outbox / Queue / Retry</text><rect x="800" y="672" width="300" height="48" rx="12" class="node"/><text x="950" y="701" class="nodeText">POS-to-CRM Sync</text><path d="M600 615 V672" class="arrow"/><path d="M750 696 H800" class="arrow"/></g>
  <path d="M950 750 V775" class="arrow"/>
  <g><rect x="65" y="780" width="1070" height="105" rx="18" class="lane"/><text x="90" y="808" class="layer">05 · CRM AND EXTERNAL BOUNDARIES</text><text x="90" y="830" class="layerDesc">Tenant-aware CRM and local / external device adapters</text><rect x="170" y="837" width="360" height="32" rx="10" class="node"/><text x="350" y="859" class="nodeText">CRM API / Database / Tenant Domain</text><rect x="670" y="837" width="360" height="32" rx="10" class="node"/><text x="850" y="859" class="nodeText">Print / RFID / External Adapters</text><path d="M950 775 V810 H350 V837" class="arrow"/></g>
  <line x1="65" y1="925" x2="1135" y2="925" stroke="#cbd5e1"/>
  <text x="65" y="955" class="note">Public-safe conceptual view · scheduler feeds the queue</text>
  <text x="65" y="980" class="note">RFID and payment remain integration boundaries, not claimed formal hardware or payment UAT</text>
  <text x="65" y="1005" class="note">Production hosts, credentials, customer data and proprietary business rules omitted</text>
</svg>
