<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Item / BOM Domain</title>
  <desc id="desc">Catalog and manufacturing relationships</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/></filter>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
    <style>
      .title{font:700 31px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .eyebrow{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#2563eb;letter-spacing:2px}
      .node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;filter:url(#shadow)}
      .nodeNo{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#2563eb;letter-spacing:1px}
      .nodeText{font:600 17px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrowHead)}
      .note{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}
      .tag{fill:url(#accent)}
    </style>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <rect x="65" y="60" width="9" height="90" rx="4" class="tag"/>
  <text x="95" y="83" class="eyebrow">ENGINEERING CASE STUDY</text>
  <text x="95" y="125" class="title">Item / BOM Domain</text>
  <text x="95" y="157" class="subtitle">Catalog and manufacturing relationships</text>
  <path d="M308 312 L325 312" class="arrow"/>
<path d="M578 312 L595 312" class="arrow"/>
<path d="M848 312 L865 312" class="arrow"/>
  <g><rect x="65" y="250" width="235" height="125" rx="18" class="node"/><text x="85" y="284" class="nodeNo">01</text><text x="85" y="311" class="nodeText">Item and Variant</text></g>
<g><rect x="335" y="250" width="235" height="125" rx="18" class="node"/><text x="355" y="284" class="nodeNo">02</text><text x="355" y="311" class="nodeText">BOM and Components</text></g>
<g><rect x="605" y="250" width="235" height="125" rx="18" class="node"/><text x="625" y="284" class="nodeNo">03</text><text x="625" y="311" class="nodeText">Cost History</text></g>
<g><rect x="875" y="250" width="235" height="125" rx="18" class="node"/><text x="895" y="284" class="nodeNo">04</text><text x="895" y="311" class="nodeText">Manufacturing and Inventory</text></g>
  <line x1="65" y1="500" x2="1135" y2="500" stroke="#cbd5e1"/>
  <text x="65" y="540" class="note">Relationships are simplified for portfolio use</text>
  <text x="65" y="575" class="note">Public-safe conceptual diagram · production hosts, credentials and customer data omitted</text>
</svg>

