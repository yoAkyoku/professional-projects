<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Recreated Memoa voice conversation demo</title><desc id="desc">A sanitized portfolio mockup showing a realtime voice conversation, waveform, playback controls and WebSocket session status.</desc>
<defs><linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6d28d9"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".12"/></filter><style>
.t{font:700 24px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.s{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}.h{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#64748b;letter-spacing:1px}.body{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#334155}.state{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#1e293b}.tiny{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}.pill{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.purple{fill:#6d28d9}
</style></defs>
<rect width="1200" height="760" fill="#f8fafc"/><rect width="1200" height="76" fill="url(#top)"/><text x="36" y="47" style="font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#fff">MEMOA VOICE AGENT</text><text x="1040" y="45" style="font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#ede9fe">RECREATED DEMO</text>
<text x="46" y="125" class="t">Voice Conversation</text><text x="46" y="151" class="s">Realtime speech turn, agent generation and playback</text>
<rect x="36" y="180" width="760" height="500" rx="18" fill="#fff" filter="url(#shadow)"/><circle cx="416" cy="262" r="48" fill="#ede9fe"/><circle cx="416" cy="262" r="28" fill="#6d28d9"/><text x="392" y="267" style="font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#fff">●</text><text x="364" y="345" class="state">Listening</text><text x="371" y="370" class="s">microphone active</text>
<path d="M105 438 L125 438 L140 410 L158 468 L177 422 L193 449 L210 400 L228 476 L248 430 L267 457 L286 416 L306 466 L327 397 L349 480 L372 420 L395 454 L416 405 L437 470 L458 430 L480 458 L500 411 L520 469 L541 422 L560 450 L580 406 L600 472 L620 430 L640 457 L660 416 L680 467 L700 428 L720 450" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="105" y1="438" x2="720" y2="438" stroke="#ddd6fe" stroke-width="2"/><text x="106" y="500" class="body">「今天天氣怎麼樣？」</text><text x="106" y="528" class="tiny">Transcript · utterance-demo-01</text>
<rect x="106" y="568" width="176" height="42" rx="21" fill="#6d28d9"/><text x="150" y="594" class="pill">Stop listening</text><rect x="298" y="568" width="136" height="42" rx="21" fill="#ede9fe"/><text x="334" y="594" style="font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#6d28d9">Replay</text><text x="106" y="650" class="tiny">Waveform and text are recreated sample data</text>
<rect x="830" y="180" width="334" height="500" rx="18" fill="#fff" filter="url(#shadow)"/><text x="862" y="225" class="h">RUNTIME STATUS</text><line x1="862" y1="244" x2="1132" y2="244" stroke="#e2e8f0"/>
<text x="862" y="288" class="s">WebSocket</text><rect x="1010" y="266" width="90" height="28" rx="14" fill="#16a34a"/><text x="1032" y="285" class="pill">Connected</text>
<text x="862" y="342" class="s">Session</text><text x="1010" y="342" class="state">Active</text>
<text x="862" y="396" class="s">Transcript</text><text x="1010" y="396" class="state">Owned</text>
<text x="862" y="450" class="s">Agent</text><rect x="1010" y="428" width="90" height="28" rx="14" fill="#f59e0b"/><text x="1032" y="447" class="pill">Thinking</text>
<text x="862" y="504" class="s">Memory</text><text x="1010" y="504" class="state">Enabled</text>
<text x="862" y="558" class="s">Search</text><text x="1010" y="558" class="state">Enabled</text>
<line x1="862" y1="592" x2="1132" y2="592" stroke="#e2e8f0"/><text x="862" y="630" class="tiny">Generation ownership, cancellation</text><text x="862" y="651" class="tiny">and reconnect behavior are documented.</text>
</svg>
