<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Recreated BOM Editor demo</title><desc id="desc">A sanitized portfolio mockup showing a nested multi-level bill of materials editor and manufacturing metadata.</desc>
<defs><linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3730a3"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".12"/></filter><style>
.t{font:700 24px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.s{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}.h{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#64748b;letter-spacing:1px}.n{font:600 16px Inter,Segoe UI,Arial,sans-serif;fill:#1e293b}.v{font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.btn{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.muted{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}.line{stroke:#cbd5e1;stroke-width:2}.branch{stroke:#94a3b8;stroke-width:2;fill:none}.tag{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#3730a3}
</style></defs>
<rect width="1200" height="760" fill="#f8fafc"/><rect width="1200" height="76" fill="url(#top)"/><text x="36" y="47" style="font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#fff">POS / ERP</text><text x="1040" y="45" style="font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#dbeafe">RECREATED DEMO</text>
<rect x="36" y="112" width="1128" height="54" rx="12" fill="#fff" filter="url(#shadow)"/><text x="62" y="146" class="t">BOM Editor</text><text x="235" y="146" class="s">Finished Product A · nested component structure</text>
<rect x="36" y="192" width="700" height="470" rx="16" fill="#fff" filter="url(#shadow)"/><text x="66" y="232" class="h">STRUCTURE</text><line x1="66" y1="250" x2="706" y2="250" class="line"/>
<path d="M90 300 V575 M90 350 H118 M90 430 H118 M90 510 H118 M118 390 V470 M118 390 H146 M118 470 H146" class="branch"/>
<circle cx="90" cy="293" r="7" fill="#3730a3"/><text x="116" y="300" class="n">Finished Product A</text><text x="580" y="300" class="tag">LEVEL 0</text>
<circle cx="126" cy="343" r="6" fill="#6366f1"/><text x="146" y="350" class="n">Raw Material A</text><text x="610" y="350" class="s">2 kg</text>
<circle cx="126" cy="423" r="6" fill="#6366f1"/><text x="146" y="430" class="n">Sub-assembly B</text><text x="565" y="430" class="tag">LEVEL 1</text>
<circle cx="154" cy="383" r="5" fill="#a5b4fc"/><text x="174" y="390" class="n">Component B1</text><text x="610" y="390" class="s">500 g</text>
<circle cx="154" cy="463" r="5" fill="#a5b4fc"/><text x="174" y="470" class="n">Component B2</text><text x="610" y="470" class="s">300 g</text>
<circle cx="126" cy="503" r="6" fill="#6366f1"/><text x="146" y="510" class="n">Raw Material C</text><text x="610" y="510" class="s">1 pcs</text>
<rect x="66" y="562" width="610" height="64" rx="10" fill="#eef2ff"/><text x="88" y="590" class="s">BOM traversal</text><text x="88" y="613" class="n">Parent → child ordering · repeated item handling · cycle guard</text>
<rect x="764" y="192" width="400" height="470" rx="16" fill="#fff" filter="url(#shadow)"/><text x="796" y="232" class="h">BOM DETAILS</text><line x1="796" y1="250" x2="1132" y2="250" class="line"/>
<text x="796" y="292" class="s">Root item</text><text x="796" y="320" class="v">Finished Product A</text>
<text x="796" y="366" class="s">BOM level</text><text x="796" y="394" class="v">3</text>
<text x="950" y="366" class="s">Components</text><text x="950" y="394" class="v">5</text>
<text x="796" y="440" class="s">Estimated cost</text><text x="796" y="468" class="v">Sample cost</text>
<rect x="796" y="510" width="146" height="40" rx="10" fill="#3730a3"/><text x="824" y="536" class="btn">Add component</text><rect x="956" y="510" width="146" height="40" rx="10" fill="#e0e7ff"/><text x="992" y="536" class="tag">Expand all</text>
<text x="796" y="600" class="muted">Sample data only · no production item information</text>
</svg>
