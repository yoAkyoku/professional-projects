<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
<title id="title">Workplace Chinese Learning Architecture</title><desc id="desc">Top-down view of learner and admin clients, web and API layers, learning domain and enterprise data</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient><linearGradient id="accent"><stop offset="0" stop-color="#d97706"/><stop offset="1" stop-color="#2563eb"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity=".13"/></filter><marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker><style>.title{font:700 31px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.sub{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.eyebrow{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#d97706;letter-spacing:2px}.layer{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#d97706;letter-spacing:1.5px}.layerDesc{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}.lane{fill:#fff;stroke:#e2e8f0;stroke-width:1.5}.node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;filter:url(#shadow)}.nodeText{font:600 16px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a;text-anchor:middle}.arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#head)}.note{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}</style></defs>
<rect width="1200" height="980" fill="url(#bg)"/><rect x="65" y="60" width="9" height="90" rx="4" fill="url(#accent)"/>
<text x="95" y="83" class="eyebrow">ENGINEERING CASE STUDY</text><text x="95" y="125" class="title">Workplace Chinese Learning</text><text x="95" y="157" class="sub">Top-down architecture · learner, admin and learning domain</text>
<g><rect x="65" y="185" width="1070" height="115" rx="18" class="lane"/><text x="90" y="213" class="layer">01 · CLIENT LAYER</text><text x="90" y="235" class="layerDesc">Learner and administrator entry points</text><rect x="180" y="250" width="300" height="42" rx="12" class="node"/><text x="330" y="277" class="nodeText">Learner Web</text><rect x="720" y="250" width="300" height="42" rx="12" class="node"/><text x="870" y="277" class="nodeText">Admin Console</text></g>
<path d="M330 300 V325 H600" class="arrow"/><path d="M870 300 V325 H600" class="arrow"/>
<g><rect x="65" y="330" width="1070" height="105" rx="18" class="lane"/><text x="90" y="358" class="layer">02 · PRESENTATION LAYER</text><text x="90" y="380" class="layerDesc">Responsive learner and administration UI</text><rect x="390" y="387" width="420" height="42" rx="12" class="node"/><text x="600" y="414" class="nodeText">Next.js Frontend</text></g>
<path d="M600 435 V460" class="arrow"/>
<g><rect x="65" y="465" width="1070" height="105" rx="18" class="lane"/><text x="90" y="493" class="layer">03 · APPLICATION LAYER</text><text x="90" y="515" class="layerDesc">API, identity checks and tenant-aware operations</text><rect x="390" y="522" width="420" height="42" rx="12" class="node"/><text x="600" y="549" class="nodeText">NestJS API</text></g>
<path d="M600 570 V595" class="arrow"/>
<g><rect x="65" y="600" width="1070" height="105" rx="18" class="lane"/><text x="90" y="628" class="layer">04 · DOMAIN LAYER</text><text x="90" y="650" class="layerDesc">Learning progress, content and factory access</text><rect x="390" y="657" width="420" height="42" rx="12" class="node"/><text x="600" y="684" class="nodeText">Learning / Tenant Domain</text></g>
<path d="M600 705 V730" class="arrow"/>
<g><rect x="65" y="735" width="1070" height="150" rx="18" class="lane"/><text x="90" y="763" class="layer">05 · DATA AND INTEGRATION LAYER</text><text x="90" y="785" class="layerDesc">Persistence, cache and operational content services</text><rect x="100" y="807" width="300" height="48" rx="12" class="node"/><text x="250" y="836" class="nodeText">PostgreSQL</text><rect x="450" y="807" width="300" height="48" rx="12" class="node"/><text x="600" y="836" class="nodeText">Redis</text><rect x="800" y="807" width="300" height="48" rx="12" class="node"/><text x="950" y="836" class="nodeText">Localization / Import / Analytics</text><path d="M600 730 V785 H250 V807" class="arrow"/><path d="M600 785 V807" class="arrow"/><path d="M600 785 H950 V807" class="arrow"/></g>
<line x1="65" y1="920" x2="1135" y2="920" stroke="#cbd5e1"/><text x="65" y="945" class="note">Enterprise identities are omitted</text><text x="65" y="970" class="note">Public-safe conceptual diagram · OCR and speech recognition excluded from implemented scope</text></svg>
