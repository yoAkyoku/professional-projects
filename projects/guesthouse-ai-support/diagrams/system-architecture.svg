<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
<title id="title">Guesthouse AI Support Architecture</title><desc id="desc">Top-down view of LINE entry, webhook, agent routing, retrieval and human escalation</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><linearGradient id="accent"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity=".13"/></filter><marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker><style>.title{font:700 31px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.sub{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.eyebrow{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#2563eb;letter-spacing:2px}.layer{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#2563eb;letter-spacing:1.5px}.layerDesc{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}.lane{fill:#fff;stroke:#e2e8f0;stroke-width:1.5}.node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;filter:url(#shadow)}.nodeText{font:600 16px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a;text-anchor:middle}.arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#head)}.note{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}</style></defs>
<rect width="1200" height="980" fill="url(#bg)"/><rect x="65" y="60" width="9" height="90" rx="4" fill="url(#accent)"/>
<text x="95" y="83" class="eyebrow">ENGINEERING CASE STUDY</text><text x="95" y="125" class="title">Guesthouse AI Support</text><text x="95" y="157" class="sub">Top-down architecture · LINE, agent and knowledge boundary</text>
<g><rect x="65" y="185" width="1070" height="105" rx="18" class="lane"/><text x="90" y="213" class="layer">01 · CHANNEL LAYER</text><text x="90" y="235" class="layerDesc">Guest conversation entry</text><rect x="390" y="242" width="420" height="42" rx="12" class="node"/><text x="600" y="269" class="nodeText">Guest / LINE User</text></g>
<path d="M600 290 V315" class="arrow"/>
<g><rect x="65" y="320" width="1070" height="105" rx="18" class="lane"/><text x="90" y="348" class="layer">02 · WEBHOOK LAYER</text><text x="90" y="370" class="layerDesc">Signature verification and event deduplication</text><rect x="390" y="377" width="420" height="42" rx="12" class="node"/><text x="600" y="404" class="nodeText">LINE Webhook</text></g>
<path d="M600 425 V450" class="arrow"/>
<g><rect x="65" y="455" width="1070" height="105" rx="18" class="lane"/><text x="90" y="483" class="layer">03 · APPLICATION LAYER</text><text x="90" y="505" class="layerDesc">API boundary and intent-aware orchestration</text><rect x="170" y="512" width="300" height="42" rx="12" class="node"/><text x="320" y="539" class="nodeText">FastAPI API</text><rect x="730" y="512" width="300" height="42" rx="12" class="node"/><text x="880" y="539" class="nodeText">LangGraph Agent</text><path d="M470 533 H730" class="arrow"/></g>
<path d="M880 560 V585 H250 V610" class="arrow"/><path d="M880 585 H600 V610" class="arrow"/><path d="M880 585 H950 V610" class="arrow"/>
<g><rect x="65" y="590" width="1070" height="150" rx="18" class="lane"/><text x="90" y="618" class="layer">04 · RESPONSE AND KNOWLEDGE LAYER</text><text x="90" y="640" class="layerDesc">Grounded answers, human handoff and provider calls</text><rect x="100" y="662" width="300" height="48" rx="12" class="node"/><text x="250" y="691" class="nodeText">RAG / Hybrid Retrieval</text><rect x="450" y="662" width="300" height="48" rx="12" class="node"/><text x="600" y="691" class="nodeText">Human Escalation</text><rect x="800" y="662" width="300" height="48" rx="12" class="node"/><text x="950" y="691" class="nodeText">LLM / Messaging Providers</text></g>
<path d="M250 740 V765 H600" class="arrow"/>
<g><rect x="65" y="770" width="1070" height="100" rx="18" class="lane"/><text x="90" y="798" class="layer">05 · DATA LAYER</text><text x="90" y="820" class="layerDesc">Tenant-scoped documents, embeddings and lexical indexes</text><rect x="390" y="827" width="420" height="42" rx="12" class="node"/><text x="600" y="854" class="nodeText">PostgreSQL / pgvector</text></g>
<line x1="65" y1="900" x2="1135" y2="900" stroke="#cbd5e1"/><text x="65" y="930" class="note">Tenant and provider details generalized</text><text x="65" y="955" class="note">Public-safe conceptual diagram · production hosts, credentials and customer data omitted</text></svg>
